        total: { type: integer }
        done: { type: integer }
    FrontDeskItem:
      type: object
      required:
        - id
        - reference
        - status
        - version
        - ratePlan
        - checkIn
        - checkOut
        - nights
        - totalCents
        - customerName
        - adults
        - children
        - customerMessage
        - rooms
        - late
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string }
        version: { type: integer }
        ratePlan: { type: string, enum: [flexible, non_refundable] }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        totalCents: { type: integer }
        customerName: { type: string, description: Nom puis prénom. }
        adults: { type: integer }
        children: { type: integer }
        customerMessage: { type: [string, 'null'] }
        late: { type: boolean, description: Attendu avant le jour affiché. }
        rooms:
          type: array
          items:
            type: object
            required: [lineId, categoryName, room]
