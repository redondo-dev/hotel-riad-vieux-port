        bookableOnline: { type: boolean }
        isActive: { type: boolean }
    ServiceChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        unitPriceCents: { type: integer, minimum: 0, maximum: 1000000 }
        pricingUnit: { type: string, enum: [per_person_night, per_night, per_stay, per_unit] }
        vatRate: { type: number, minimum: 0, maximum: 100 }
        bookableOnline: { type: boolean }
        isActive: { type: boolean }
    PublicHotel:
      type: object
      required:
        - name
        - address
        - phone
        - email
        - checkInFrom
        - checkOutBefore
        - timeZone
        - bookingRules
      properties:
        name: { type: string, example: Hôtel Riad Vieux-Port }
        address:
          type: string
          description: Adresse postale, identique dans toutes les langues.
        phone:
          type: object
          required: [display, international]
          properties:
            display: { type: string, example: 04 65 71 00 00 }
            international: { type: string, example: '+33465710000' }
