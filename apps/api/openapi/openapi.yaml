openapi: 3.1.0
info:
  title: API de l'Hôtel Riad Vieux-Port
  version: 0.1.0
  description: |
    API REST du site de réservation et de l'outil de gestion (hôtel fictif, projet portfolio).

    **État : contrôle de santé, comptes du personnel, catalogue (public et gestion), ménage
    et pannes implémentés.** Ce fichier ne décrit que ce qui
    existe réellement ; chaque module y ajoutera ses points d'accès au fur et à mesure.
    La spécification complète validée figure dans le dossier d'architecture (section 5).

    Conventions communes : JSON, champs en camelCase, dates `AAAA-MM-JJ`, montants en
    centimes d'euro, erreurs au format RFC 9457 (schéma `Problem` ci-dessous).

    Toute réponse porte l'en-tête `X-Trace-Id`, identifiant à communiquer en cas de problème.
    Erreurs communes à toutes les routes : 400 `MALFORMED_JSON` ou `VALIDATION_FAILED`,
    403 `ORIGIN_NOT_ALLOWED` (site non autorisé), 404 `NOT_FOUND`, 413 `PAYLOAD_TOO_LARGE`
    (corps de plus de 100 Ko), 429 `TOO_MANY_REQUESTS` (plus de 300 requêtes par minute et par
    adresse IP), 500 `INTERNAL_ERROR`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Contrôle de santé
      description: |
        Utilisé par l'hébergeur et la surveillance. Répond 200 si l'API et la base de données
        répondent, 503 sinon. Aucun détail interne n'est jamais renvoyé.
      tags: [Technique]
      responses:
        '200':
          description: L'API et la base de données répondent.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: La base de données ne répond pas (code `SERVICE_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/hotel:
    get:
      operationId: getPublicHotel
      summary: Informations de l'hôtel
      description: |
        Nom, adresse, contact, horaires et règles de réservation en ligne. Réponse publique,
        sans session, que les caches peuvent garder 5 minutes
        (`Cache-Control: public, max-age=300`).
      tags: [Catalogue public]
      responses:
        '200':
          description: Informations de l'hôtel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHotel' }
        '503':
          description: L'hôtel n'est pas encore configuré (code `HOTEL_NOT_CONFIGURED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/room-categories:
    get:
      operationId: listPublicRoomCategories
      summary: Catégories de chambres réservables
      description: |
        Catégories actives ayant au moins une chambre active, dans l'ordre d'affichage, textes en
        français et en anglais. `fromPriceCents` est le prix le plus bas d'une nuit réservable en
        ligne à partir d'aujourd'hui (saisons et événements compris), au tarif non remboursable.
        Mise en cache publique de 5 minutes.
      tags: [Catalogue public]
      responses:
        '200':
          description: Catégories réservables.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicRoomCategory' }
        '503':
          description: L'hôtel n'est pas encore configuré (code `HOTEL_NOT_CONFIGURED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/services:
    get:
      operationId: listPublicServices
      summary: Options réservables en ligne
      description: |
        Options actives que le client peut ajouter à sa réservation en ligne (petit-déjeuner, lit
        bébé…), avec leur prix TTC. Mise en cache publique de 5 minutes.
      tags: [Catalogue public]
      responses:
        '200':
          description: Options réservables en ligne.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicService' }
  /admin/session:
    post:
      operationId: logIn
      summary: Connexion du personnel
      description: |
        Ouvre une nouvelle session (cookie `riad.sid`, HttpOnly, SameSite=Strict). Après
        5 mots de passe erronés, le compte est bloqué 15 minutes ; au plus 10 échecs par
        15 minutes par adresse IP et par compte (429). Réponse identique quelle que soit la cause
        de l'échec.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getSession
      summary: Compte connecté et jeton anti-CSRF
      tags: [Personnel]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Session valide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: logOut
      summary: Déconnexion
      tags: [Personnel]
      security: [{ staffSession: [], csrfToken: [] }]
      responses:
        '204': { description: Session fermée. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/session/password:
    post:
      operationId: changeOwnPassword
      summary: Changer son mot de passe
      description: Les autres sessions du compte sont fermées.
      tags: [Personnel]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Mot de passe changé. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Demander un lien de réinitialisation
      description: |
        Réponse identique que l'adresse existe ou non. Le lien, valable 30 minutes, est envoyé
        par e-mail ; 5 demandes par heure et par adresse IP au maximum.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Demande prise en compte. }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Choisir un nouveau mot de passe avec le lien reçu
      description: Lien à usage unique ; toutes les sessions du compte sont fermées.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Mot de passe défini. }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/users:
    get:
      operationId: listUsers
      summary: Lister les comptes (direction)
      tags: [Comptes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Comptes du personnel.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      summary: Créer un compte (direction)
      description: |
        Aucun mot de passe n'est choisi par la direction : la personne reçoit un lien, valable
        48 heures, pour le définir. `invitationSent` vaut false si l'e-mail n'a pas pu partir.
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, firstName, lastName, role]
              properties:
                email: { type: string, format: email }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema:
                type: object
                required: [user, invitationSent]
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
                  invitationSent: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Modifier, désactiver ou réactiver un compte (direction)
      description: |
        Un changement de rôle ou une désactivation ferme les sessions du compte. Refusé (409)
        sur son propre compte (`CANNOT_REMOVE_OWN_ACCESS`) ou pour le dernier compte de
        direction actif (`LAST_MANAGER_ACCOUNT`). Aucune suppression de compte.
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200':
          description: Compte modifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/password-reset:
    post:
      operationId: sendUserResetLink
      summary: Envoyer un lien de réinitialisation à un employé (direction)
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Lien envoyé. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Catégories (gestion)
      description: |
        Toutes les catégories, inactives comprises, avec le nombre de chambres (toutes et actives).
        Direction et réception ; jamais mis en cache.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories/{id}:
    patch:
      operationId: updateCatalogCategory
      summary: Modifier une catégorie (direction)
      description: |
        Textes (français ET anglais), prix, capacité, équipements, ordre d'affichage, activation.
        Le code ne change jamais (il figure dans les adresses du site). Une modification de prix ne
        touche que les futures réservations. Inscrit au journal d'audit (avant → après).
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rooms:
    get:
      operationId: listCatalogRooms
      summary: Chambres (gestion)
      description: |
        Toutes les chambres, triées par étage puis numéro. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: floor, in: query, schema: { type: integer, minimum: -5, maximum: 50 } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoomAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogRoom
      summary: Ajouter une chambre (direction)
      description: |
        Numéro déjà utilisé : 409 `ROOM_NUMBER_TAKEN`.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRoom' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rooms/{id}:
    patch:
      operationId: updateCatalogRoom
      summary: Modifier une chambre (direction)
      description: |
        Numéro, étage, catégorie, activation. Aucune suppression : une chambre se désactive.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rate-periods:
    get:
      operationId: listCatalogRatePeriods
      summary: Saisons et événements
      description: |
        Périodes en cours et à venir ; toutes avec `includePast=true`. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      parameters:
        - { name: includePast, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RatePeriod' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogRatePeriod
      summary: Ajouter une saison ou un événement (direction)
      description: |
        Nuits données par la première et la dernière, incluses. Deux périodes du même type et
        de la même portée (toutes catégories, ou la même catégorie) ne peuvent pas partager une
        nuit : 409 `RATE_PERIOD_OVERLAP`. Un événement l'emporte sur une saison.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRatePeriod' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatePeriod' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rate-periods/{id}:
    patch:
      operationId: updateCatalogRatePeriod
      summary: Modifier une période (direction)
      description: |
        Mêmes règles que la création.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatePeriodChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatePeriod' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteCatalogRatePeriod
      summary: Supprimer une période (direction)
      description: |
        Les valeurs supprimées restent lisibles dans le journal d'audit.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Supprimé.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/sales-closures:
    get:
      operationId: listCatalogSalesClosures
      summary: Fermetures de vente
      description: |
        Fermetures en cours et à venir. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SalesClosure' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogSalesClosure
      summary: Fermer une catégorie à la vente (direction, réception)
      description: |
        Ferme une catégorie à la vente en ligne et au comptoir sur des nuits données (incluses).
        Refusé si la dernière nuit est passée.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSalesClosure' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesClosure' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/sales-closures/{id}:
    delete:
      operationId: deleteCatalogSalesClosure
      summary: Rouvrir à la vente (direction, réception)
      description: |
        Supprime la fermeture ; inscrit au journal d'audit.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Supprimé.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/services:
    get:
      operationId: listCatalogServices
      summary: Services et options (gestion)
      description: |
        Tous les services, inactifs compris, avec le taux de TVA. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/services/{id}:
    patch:
      operationId: updateCatalogService
      summary: Modifier un service (direction)
      description: |
        Nom, prix TTC, unité de prix, TVA, réservable en ligne, activation. Le code ne change
        pas.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms:
    get:
      operationId: getHousekeepingBoard
      summary: État du ménage
      description: |
        Chambres actives et leur état, triées par étage puis numéro, avec le décompte de
        l'hôtel. Direction, réception et ménage ; jamais mis en cache.
      tags: [Ménage]
      security: [{ staffSession: [] }]
      parameters:
        - { name: floor, in: query, schema: { type: integer, minimum: -5, maximum: 50 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HousekeepingStatus' } }
      responses:
        '200':
          description: État du ménage.
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HousekeepingRoom' }
                  summary:
                    type: object
                    required: [total, dirty]
                    properties:
                      total: { type: integer, description: Chambres actives. }
                      dirty: { type: integer, description: Chambres à nettoyer. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms/{id}:
    patch:
      operationId: setHousekeepingStatus
      summary: Changer l'état d'une chambre
      description: |
        Ménage et direction : propre ou à nettoyer. Réception : à nettoyer seulement (sinon 403
        `HOUSEKEEPING_STATUS_FORBIDDEN`). Chambre désactivée ou inconnue : 404. Inscrit au
        journal d'audit si l'état change.
      tags: [Ménage]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/HousekeepingStatus' }
      responses:
        '200':
          description: Chambre dans son nouvel état.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HousekeepingRoom' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms/status:
    post:
      operationId: setHousekeepingStatusOfRooms
      summary: Changer l'état de plusieurs chambres
      description: |
        Tout ou rien : si une chambre est inconnue ou désactivée (404), aucune ne change.
        `changed` compte les chambres dont l'état a vraiment changé. Mêmes droits que pour une
        chambre.
      tags: [Ménage]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomIds, status]
              properties:
                roomIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/HousekeepingStatus' }
      responses:
        '200':
          description: Chambres dans leur nouvel état.
          content:
            application/json:
              schema:
                type: object
                required: [items, changed]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HousekeepingRoom' }
                  changed: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/incidents:
    get:
      operationId: listIncidents
      summary: Pannes
      description: |
        Pannes non clôturées (toutes avec `includeClosed=true`), les urgentes d'abord puis les
        plus récentes. 200 au maximum. Tous les rôles du personnel ; jamais mis en cache.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IncidentStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/IncidentPriority' } }
        - { name: roomId, in: query, schema: { type: string, format: uuid } }
        - name: mine
          in: query
          description: '« true » : seulement les pannes assignées à la personne connectée.'
          schema: { type: string, enum: ['true', 'false'] }
        - { name: includeClosed, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Pannes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: reportIncident
      summary: Signaler une panne
      description: |
        Une chambre ou un lieu est obligatoire. « Chambre inutilisable » (`blocksRoom`, chambre
        seulement) la retire de la vente aussitôt, même si elle est réservée. Tous les rôles.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewIncident' }
      responses:
        '201':
          description: Panne enregistrée, avec son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/rooms:
    get:
      operationId: listIncidentRooms
      summary: Chambres actives (formulaire de signalement)
      description: |
        Numéro et étage des chambres actives, pour choisir la chambre d'une panne. Tous les
        rôles du personnel.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Chambres actives.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, number, floor]
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        floor: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/technicians:
    get:
      operationId: listTechnicians
      summary: Techniciens actifs (direction, réception)
      description: |
        Pour choisir à qui assigner une panne.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Techniciens actifs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonName' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}:
    get:
      operationId: getIncident
      summary: Une panne et son historique
      description: |
        Tous les rôles du personnel.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/status:
    post:
      operationId: changeIncidentStatus
      summary: Changer l'état d'une panne
      description: |
        Technique : signalée → en cours → résolue. Direction : tout, dont clôturer une panne
        résolue ou la rouvrir (résolue → en cours). Résolue : la chambre revient à la vente ;
        rouverte : elle est de nouveau bloquée. Changement inexistant : 409
        `INCIDENT_TRANSITION_INVALID` ; rôle non autorisé : 403.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/IncidentStatus' }
                comment: { type: [string, 'null'], maxLength: 4000 }
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/assignment:
    post:
      operationId: assignIncident
      summary: Assigner une panne (direction, réception)
      description: |
        À un technicien actif (sinon 400) et/ou à un prestataire externe nommé en texte. Panne
        clôturée : 409 `INCIDENT_CLOSED`.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignedTo]
              properties:
                assignedTo: { type: [string, 'null'], format: uuid }
                externalContractor: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/comments:
    post:
      operationId: commentIncident
      summary: Commenter une panne
      description: |
        Ajoute un commentaire à l'historique. Tous les rôles ; panne clôturée : 409
        `INCIDENT_CLOSED`.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: riad.sid
      description: Session du personnel ; déconnexion après 30 min d'inactivité ou 12 h.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Jeton reçu à la connexion, exigé sur toute requête qui modifie des données.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    LocalizedText:
      type: object
      required: [fr, en]
      properties:
        fr: { type: string }
        en: { type: string }
    IncidentStatus:
      type: string
      enum: [reported, in_progress, resolved, closed]
      description: Signalée, en cours, résolue, clôturée.
    IncidentPriority:
      type: string
      enum: [urgent, normal, low]
    PersonName:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
    Incident:
      type: object
      required:
        - id
        - reference
        - room
        - location
        - title
        - description
        - priority
        - status
        - blocksRoom
        - roomBlocked
        - reportedAt
        - reportedBy
        - assignedTo
        - externalContractor
        - resolvedAt
        - closedAt
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: INC-000042 }
        room:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, number]
              properties:
                id: { type: string, format: uuid }
                number: { type: string }
        location: { type: [string, 'null'] }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        blocksRoom: { type: boolean, description: Chambre déclarée inutilisable. }
        roomBlocked: { type: boolean, description: Chambre hors vente à cause de cette panne. }
        reportedAt: { type: string, format: date-time }
        reportedBy: { $ref: '#/components/schemas/PersonName' }
        assignedTo:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PersonName'
        externalContractor: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items:
                type: object
                required: [id, type, fromStatus, toStatus, comment, actor, createdAt]
                properties:
                  id: { type: string }
                  type: { type: string, enum: [status_change, assignment, comment] }
                  fromStatus:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/IncidentStatus'
                  toStatus:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/IncidentStatus'
                  comment: { type: [string, 'null'] }
                  actor:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/PersonName'
                  createdAt: { type: string, format: date-time }
    NewIncident:
      type: object
      additionalProperties: false
      required: [title, description, priority]
      properties:
        roomId: { type: [string, 'null'], format: uuid }
        location: { type: [string, 'null'], maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        blocksRoom: { type: boolean, default: false }
    HousekeepingStatus:
      type: string
      enum: [clean, dirty]
      description: '« clean » : propre ; « dirty » : à nettoyer.'
    HousekeepingRoom:
      type: object
      required: [id, number, floor, categoryCode, categoryName, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: '214' }
        floor: { type: integer }
        categoryCode: { type: string }
        categoryName: { type: string }
        status: { $ref: '#/components/schemas/HousekeepingStatus' }
    Amenity:
      type: string
      enum:
        - wifi
        - air-conditioning
        - tv
        - safe
        - hair-dryer
        - shower
        - bathtub
        - sitting-area
        - port-view
    Night:
      type: string
      format: date
      description: Nuit désignée par le jour où elle commence (AAAA-MM-JJ).
    CategoryAdmin:
      type: object
      required:
        - id
        - code
        - name
        - description
        - beds
        - areaSqm
        - maxOccupancy
        - baseOccupancy
        - basePriceCents
        - extraAdultCents
        - extraChildCents
        - amenities
        - sortOrder
        - isActive
        - roomCount
        - activeRoomCount
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        beds: { $ref: '#/components/schemas/LocalizedText' }
        areaSqm: { type: integer }
        maxOccupancy: { type: integer }
        baseOccupancy: { type: integer }
        basePriceCents: { type: integer }
        extraAdultCents: { type: integer }
        extraChildCents: { type: integer }
        amenities: { type: array, items: { $ref: '#/components/schemas/Amenity' } }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        roomCount: { type: integer }
        activeRoomCount: { type: integer }
    CategoryChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        beds: { $ref: '#/components/schemas/LocalizedText' }
        areaSqm: { type: integer, minimum: 1, maximum: 500 }
        maxOccupancy: { type: integer, minimum: 1, maximum: 10 }
        baseOccupancy:
          type: integer
          minimum: 1
          maximum: 10
          description: Jamais plus que maxOccupancy.
        basePriceCents: { type: integer, minimum: 1, maximum: 1000000 }
        extraAdultCents: { type: integer, minimum: 0, maximum: 1000000 }
        extraChildCents: { type: integer, minimum: 0, maximum: 1000000 }
        amenities: { type: array, items: { $ref: '#/components/schemas/Amenity' } }
        sortOrder: { type: integer, minimum: 0, maximum: 999 }
        isActive: { type: boolean }
    RoomAdmin:
      type: object
      required:
        - id
        - number
        - floor
        - categoryId
        - categoryCode
        - categoryName
        - housekeepingStatus
        - isActive
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: '214' }
        floor: { type: integer }
        categoryId: { type: string, format: uuid }
        categoryCode: { type: string }
        categoryName: { type: string }
        housekeepingStatus: { type: string, enum: [clean, dirty] }
        isActive: { type: boolean }
    NewRoom:
      type: object
      additionalProperties: false
      required: [number, floor, categoryId]
      properties:
        number: { type: string, pattern: '^[0-9A-Za-z-]{1,10}$' }
        floor: { type: integer, minimum: -5, maximum: 50 }
        categoryId: { type: string, format: uuid }
        isActive: { type: boolean, default: true }
    RoomChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        number: { type: string, pattern: '^[0-9A-Za-z-]{1,10}$' }
        floor: { type: integer, minimum: -5, maximum: 50 }
        categoryId: { type: string, format: uuid }
        isActive: { type: boolean }
    RatePeriod:
      type: object
      required:
        - id
        - name
        - kind
        - firstNight
        - lastNight
        - adjustmentPct
        - categoryId
        - categoryCode
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [season, event] }
        firstNight: { $ref: '#/components/schemas/Night' }
        lastNight: { $ref: '#/components/schemas/Night' }
        adjustmentPct: { type: number, description: 'Pourcentage ajouté au prix de base.' }
        categoryId: { type: [string, 'null'], format: uuid, description: 'null : toutes.' }
        categoryCode: { type: [string, 'null'] }
    NewRatePeriod:
      type: object
      additionalProperties: false
      required: [name, kind, firstNight, lastNight, adjustmentPct, categoryId]
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [season, event] }
        firstNight: { $ref: '#/components/schemas/Night' }
        lastNight: { $ref: '#/components/schemas/Night' }
        adjustmentPct: { type: number, minimum: -100, maximum: 1000 }
        categoryId: { type: [string, 'null'], format: uuid }
    RatePeriodChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [season, event] }
        firstNight: { $ref: '#/components/schemas/Night' }
        lastNight: { $ref: '#/components/schemas/Night' }
        adjustmentPct: { type: number, minimum: -100, maximum: 1000 }
        categoryId: { type: [string, 'null'], format: uuid }
    SalesClosure:
      type: object
      required:
        - id
        - categoryId
        - categoryCode
        - firstNight
        - lastNight
        - reason
        - createdAt
        - createdBy
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryCode: { type: string }
        firstNight: { $ref: '#/components/schemas/Night' }
        lastNight: { $ref: '#/components/schemas/Night' }
        reason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        createdBy:
          oneOf:
            - type: 'null'
            - type: object
              required: [firstName, lastName]
              properties:
                firstName: { type: string }
                lastName: { type: string }
    NewSalesClosure:
      type: object
      additionalProperties: false
      required: [categoryId, firstNight, lastNight]
      properties:
        categoryId: { type: string, format: uuid }
        firstNight: { $ref: '#/components/schemas/Night' }
        lastNight: { $ref: '#/components/schemas/Night' }
        reason: { type: [string, 'null'], maxLength: 300 }
    ServiceAdmin:
      type: object
      required:
        - id
        - code
        - name
        - unitPriceCents
        - pricingUnit
        - vatRate
        - bookableOnline
        - isActive
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        unitPriceCents: { type: integer }
        pricingUnit: { type: string, enum: [per_person_night, per_night, per_stay, per_unit] }
        vatRate: { type: number, example: 10 }
        bookableOnline: { type: boolean }
        isActive: { type: boolean }
    ServiceChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        unitPriceCents: { type: integer, minimum: 0, maximum: 1000000 }
        pricingUnit: { type: string, enum: [per_person_night, per_night, per_stay, per_unit] }
        vatRate: { type: number, minimum: 0, maximum: 100 }
        bookableOnline: { type: boolean }
        isActive: { type: boolean }
    PublicHotel:
      type: object
      required:
        - name
        - address
        - phone
        - email
        - checkInFrom
        - checkOutBefore
        - timeZone
        - bookingRules
      properties:
        name: { type: string, example: Hôtel Riad Vieux-Port }
        address:
          type: string
          description: Adresse postale, identique dans toutes les langues.
        phone:
          type: object
          required: [display, international]
          properties:
            display: { type: string, example: 04 65 71 00 00 }
            international: { type: string, example: '+33465710000' }
        email: { type: string, format: email }
        checkInFrom: { type: string, pattern: '^\d{2}:\d{2}$', example: '15:00' }
        checkOutBefore: { type: string, pattern: '^\d{2}:\d{2}$', example: '12:00' }
        timeZone: { type: string, example: Europe/Paris }
        bookingRules:
          type: object
          required:
            - maxStayNights
            - bookingHorizonDays
            - sameDayCutoffMinutes
            - nonRefundableDiscountPercent
            - freeCancellationHours
          properties:
            maxStayNights: { type: integer, example: 30 }
            bookingHorizonDays: { type: integer, example: 365 }
            sameDayCutoffMinutes:
              type: integer
              description: Heure limite d'une arrivée le jour même, en minutes après minuit.
              example: 1380
            nonRefundableDiscountPercent: { type: number, example: 10 }
            freeCancellationHours: { type: integer, example: 48 }
    PublicRoomCategory:
      type: object
      required:
        - code
        - name
        - description
        - beds
        - maxOccupancy
        - baseOccupancy
        - areaSqm
        - roomCount
        - amenities
        - basePriceCents
        - extraAdultCents
        - extraChildCents
        - fromPriceCents
      properties:
        code: { type: string, example: double-standard }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        beds: { $ref: '#/components/schemas/LocalizedText' }
        maxOccupancy: { type: integer, example: 2 }
        baseOccupancy:
          type: integer
          description: Nombre de personnes comprises dans le prix.
          example: 2
        areaSqm: { type: integer, example: 18 }
        roomCount: { type: integer, example: 40 }
        amenities:
          type: array
          items: { type: string }
          example: [wifi, air-conditioning, shower]
        basePriceCents:
          type: integer
          description: Prix d'une nuit au tarif flexible, hors saison et événement.
          example: 9500
        extraAdultCents: { type: integer, example: 2500 }
        extraChildCents: { type: integer, example: 1500 }
        fromPriceCents:
          type: integer
          description: Prix « à partir de » d'une nuit, tarif non remboursable.
          example: 8550
    PublicService:
      type: object
      required: [code, name, unitPriceCents, pricingUnit]
      properties:
        code: { type: string, example: breakfast }
        name: { $ref: '#/components/schemas/LocalizedText' }
        unitPriceCents: { type: integer, example: 1400 }
        pricingUnit:
          type: string
          enum: [per_person_night, per_night, per_stay, per_unit]
    Role:
      type: string
      enum: [direction, reception, housekeeping, technician]
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
    StaffUser:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    SessionView:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/StaffUser' }
        csrfToken:
          type: string
          description: À renvoyer dans l'en-tête X-CSRF-Token des requêtes qui modifient.
    UserSummary:
      allOf:
        - $ref: '#/components/schemas/StaffUser'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive: { type: boolean }
            lastLoginAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
    Problem:
      type: object
      description: Erreur au format RFC 9457, sans détail technique interne.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://api.riad-vieux-port.example/errors/availability-changed
        title:
          type: string
          example: Chambres plus disponibles
        status:
          type: integer
          example: 409
        code:
          type: string
          description: Code d'erreur métier stable, utilisable par les applications.
          example: AVAILABILITY_CHANGED
        detail:
          type: string
          example: Il ne reste plus de chambre Double supérieure du 12 au 15 mai.
        errors:
          type: array
          description: Erreurs de validation, champ par champ.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: rooms[0].adults
              message:
                type: string
        traceId:
          type: string
          description: Identifiant reliant l'erreur au journal du serveur.
