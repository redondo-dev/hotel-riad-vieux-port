          type: string
          description: À renvoyer dans l'en-tête X-CSRF-Token des requêtes qui modifient.
    UserSummary:
      allOf:
        - $ref: '#/components/schemas/StaffUser'
        - type: object
          required: [isActive, createdAt]
          properties:
            isActive: { type: boolean }
            lastLoginAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
    Problem:
      type: object
      description: Erreur au format RFC 9457, sans détail technique interne.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://api.riad-vieux-port.example/errors/availability-changed
        title:
          type: string
          example: Chambres plus disponibles
        status:
          type: integer
          example: 409
        code:
          type: string
          description: Code d'erreur métier stable, utilisable par les applications.
          example: AVAILABILITY_CHANGED
        detail:
          type: string
          example: Il ne reste plus de chambre Double supérieure du 12 au 15 mai.
        errors:
          type: array
          description: Erreurs de validation, champ par champ.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: rooms[0].adults
              message:
                type: string
        traceId:
          type: string
          description: Identifiant reliant l'erreur au journal du serveur.
