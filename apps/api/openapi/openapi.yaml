              lineId: { type: string, format: uuid }
              categoryName: { type: string }
              room:
                type: [object, 'null']
                properties:
                  id: { type: string, format: uuid }
                  number: { type: string }
                  housekeepingStatus: { type: string, enum: [clean, dirty] }
                  outOfService: { type: boolean }
    FrontDeskDay:
      type: object
      required: [date, arrivals, departures]
      properties:
        date: { type: string, format: date }
        arrivals: { $ref: '#/components/schemas/FrontDeskList' }
        departures: { $ref: '#/components/schemas/FrontDeskList' }
    FrontDeskList:
      type: object
      required: [total, done, items]
      properties:
        total: { type: integer, description: Séjours du jour (les retards ne comptent pas). }
        done: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/FrontDeskItem' } }
    Planning:
      type: object
      required: [from, to, categories]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        categories:
          type: array
          items:
            type: object
            required: [id, code, name, rooms, unassigned]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              rooms:
                type: array
                items:
                  type: object
                  required: [id, number, floor, housekeepingStatus, isActive, stays, blocks]
                  properties:
                    id: { type: string, format: uuid }
                    number: { type: string }
                    floor: { type: integer }
                    housekeepingStatus: { type: string, enum: [clean, dirty] }
                    isActive: { type: boolean }
                    stays: { type: array, items: { $ref: '#/components/schemas/PlanningStay' } }
                    blocks:
                      type: array
                      items:
                        type: object
                        properties:
                          from: { type: string, format: date }
                          to:
                            type: [string, 'null']
                            format: date
                            description: Lendemain de la dernière nuit ; null si fin inconnue.
                          reason: { type: string, enum: [incident, maintenance, other] }
                          incident:
                            oneOf:
                              - type: object
                                properties:
                                  id: { type: string, format: uuid }
                                  reference: { type: string }
                              - type: 'null'
              unassigned:
                type: array
                description: Ligne « À attribuer » de la catégorie.
                items: { $ref: '#/components/schemas/PlanningStay' }
    ReservationChanges:
      type: object
      additionalProperties: false
      description: Un champ absent ne change pas ; une note vide ou null est effacée.
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        rooms:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [lineId, adults]
            properties:
              lineId: { type: string, format: uuid }
              adults: { type: integer, minimum: 1, maximum: 4 }
              childrenAges:
                type: array
                maxItems: 3
                items: { type: integer, minimum: 0, maximum: 17 }
              babyCot: { type: boolean, default: false }
        internalNotes: { type: [string, 'null'], maxLength: 2000 }
        customerMessage: { type: [string, 'null'], maxLength: 500 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ChangePreview:
      type: object
      required: [checkIn, checkOut, previousTotalCents, totalCents, differenceCents]
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        previousTotalCents: { type: integer }
        totalCents: { type: integer }
        differenceCents: { type: integer, description: Positive si le séjour coûte plus cher. }
        rooms: { type: array, items: { type: object } }
        charges: { type: array, items: { type: object } }
    ReservationSummary:
      type: object
      required:
        - id
        - reference
        - customer
        - checkIn
        - checkOut
        - nights
        - rooms
        - status
        - paymentStatus
        - totalCents
        - source
        - createdAt
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: K7M2QX9A }
        customer:
          type: object
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
            email: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        rooms:
          type: array
          items:
            type: object
            properties:
              categoryName: { type: string }
              roomNumber: { type: [string, 'null'], description: null tant que non attribuée. }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        totalCents: { type: integer }
        source: { type: string, enum: [website, phone, desk] }
        createdAt: { type: string, format: date-time }
    ReservationDetail:
      type: object
      required:
        - id
        - reference
        - status
        - paymentStatus
        - source
        - ratePlan
        - checkIn
        - checkOut
        - nights
        - totalCents
        - version
        - customer
        - rooms
        - charges
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        source: { type: string, enum: [website, phone, desk] }
        ratePlan: { type: string, enum: [flexible, non_refundable] }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        totalCents: { type: integer, description: Nuits, prestations et taxe de séjour. }
        freeCancellationUntil:
          type: [string, 'null']
          format: date-time
          description: Tarif flexible seulement (RM-15).
        customerMessage: { type: [string, 'null'] }
        internalNotes: { type: [string, 'null'] }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancellationReason: { type: [string, 'null'] }
        cancellationFeeCents:
          type: integer
          description: Frais d'annulation à encaisser (0 si gratuite ou si la direction y renonce).
        version: { type: integer, description: Verrou optimiste, à renvoyer pour modifier. }
        createdAt: { type: string, format: date-time }
        createdBy: { oneOf: [{ $ref: '#/components/schemas/PersonName' }, { type: 'null' }] }
        customer: { $ref: '#/components/schemas/Customer' }
        rooms:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              category:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string }
                  name: { type: string }
              room:
                oneOf:
                  - type: object
                    properties:
                      id: { type: string, format: uuid }
                      number: { type: string }
