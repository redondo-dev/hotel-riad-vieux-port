openapi: 3.1.0
info:
  title: API de l'Hôtel Riad Vieux-Port
  version: 0.1.0
  description: |
    API REST du site de réservation et de l'outil de gestion (hôtel fictif, projet portfolio).

    **État : contrôle de santé, comptes du personnel, catalogue (public et gestion), ménage,
    pannes, disponibilités, réservations du personnel, leurs modifications et planning
    implémentés.** Ce fichier ne décrit que ce qui existe réellement ; chaque module y ajoutera
    ses points d'accès au fur et à mesure.
    La spécification complète validée figure dans le dossier d'architecture (section 5).

    Conventions communes : JSON, champs en camelCase, dates `AAAA-MM-JJ`, montants en
    centimes d'euro, erreurs au format RFC 9457 (schéma `Problem` ci-dessous).

    Toute réponse porte l'en-tête `X-Trace-Id`, identifiant à communiquer en cas de problème.
    Erreurs communes à toutes les routes : 400 `MALFORMED_JSON` ou `VALIDATION_FAILED`,
    403 `ORIGIN_NOT_ALLOWED` (site non autorisé), 404 `NOT_FOUND`, 413 `PAYLOAD_TOO_LARGE`
    (corps de plus de 100 Ko), 429 `TOO_MANY_REQUESTS` (plus de 300 requêtes par minute et par
    adresse IP), 500 `INTERNAL_ERROR`.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Contrôle de santé
      description: |
        Utilisé par l'hébergeur et la surveillance. Répond 200 si l'API et la base de données
        répondent, 503 sinon. Aucun détail interne n'est jamais renvoyé.
      tags: [Technique]
      responses:
        '200':
          description: L'API et la base de données répondent.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: La base de données ne répond pas (code `SERVICE_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /public/hotel:
    get:
      operationId: getPublicHotel
      summary: Informations de l'hôtel
      description: |
        Nom, adresse, contact, horaires et règles de réservation en ligne. Réponse publique,
        sans session, que les caches peuvent garder 5 minutes
        (`Cache-Control: public, max-age=300`).
      tags: [Catalogue public]
      responses:
        '200':
          description: Informations de l'hôtel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicHotel' }
        '503':
          description: L'hôtel n'est pas encore configuré (code `HOTEL_NOT_CONFIGURED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/room-categories:
    get:
      operationId: listPublicRoomCategories
      summary: Catégories de chambres réservables
      description: |
        Catégories actives ayant au moins une chambre active, dans l'ordre d'affichage, textes en
        français et en anglais. `fromPriceCents` est le prix le plus bas d'une nuit réservable en
        ligne à partir d'aujourd'hui (saisons et événements compris), au tarif non remboursable.
        Mise en cache publique de 5 minutes.
      tags: [Catalogue public]
      responses:
        '200':
          description: Catégories réservables.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicRoomCategory' }
        '503':
          description: L'hôtel n'est pas encore configuré (code `HOTEL_NOT_CONFIGURED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /public/services:
    get:
      operationId: listPublicServices
      summary: Options réservables en ligne
      description: |
        Options actives que le client peut ajouter à sa réservation en ligne (petit-déjeuner, lit
        bébé…), avec leur prix TTC. Mise en cache publique de 5 minutes.
      tags: [Catalogue public]
      responses:
        '200':
          description: Options réservables en ligne.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicService' }
  /admin/session:
    post:
      operationId: logIn
      summary: Connexion du personnel
      description: |
        Ouvre une nouvelle session (cookie `riad.sid`, HttpOnly, SameSite=Strict). Après
        5 mots de passe erronés, le compte est bloqué 15 minutes ; au plus 10 échecs par
        15 minutes par adresse IP et par compte (429). Réponse identique quelle que soit la cause
        de l'échec.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    get:
      operationId: getSession
      summary: Compte connecté et jeton anti-CSRF
      tags: [Personnel]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Session valide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionView' }
        '401': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: logOut
      summary: Déconnexion
      tags: [Personnel]
      security: [{ staffSession: [], csrfToken: [] }]
      responses:
        '204': { description: Session fermée. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/session/password:
    post:
      operationId: changeOwnPassword
      summary: Changer son mot de passe
      description: Les autres sessions du compte sont fermées.
      tags: [Personnel]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Mot de passe changé. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Demander un lien de réinitialisation
      description: |
        Réponse identique que l'adresse existe ou non. Le lien, valable 30 minutes, est envoyé
        par e-mail ; 5 demandes par heure et par adresse IP au maximum.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Demande prise en compte. }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Choisir un nouveau mot de passe avec le lien reçu
      description: Lien à usage unique ; toutes les sessions du compte sont fermées.
      tags: [Personnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204': { description: Mot de passe défini. }
        '400': { $ref: '#/components/responses/Problem' }
  /admin/users:
    get:
      operationId: listUsers
      summary: Lister les comptes (direction)
      tags: [Comptes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Comptes du personnel.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      summary: Créer un compte (direction)
      description: |
        Aucun mot de passe n'est choisi par la direction : la personne reçoit un lien, valable
        48 heures, pour le définir. `invitationSent` vaut false si l'e-mail n'a pas pu partir.
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, firstName, lastName, role]
              properties:
                email: { type: string, format: email }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema:
                type: object
                required: [user, invitationSent]
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
                  invitationSent: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Modifier, désactiver ou réactiver un compte (direction)
      description: |
        Un changement de rôle ou une désactivation ferme les sessions du compte. Refusé (409)
        sur son propre compte (`CANNOT_REMOVE_OWN_ACCESS`) ou pour le dernier compte de
        direction actif (`LAST_MANAGER_ACCOUNT`). Aucune suppression de compte.
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200':
          description: Compte modifié.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/password-reset:
    post:
      operationId: sendUserResetLink
      summary: Envoyer un lien de réinitialisation à un employé (direction)
      tags: [Comptes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Lien envoyé. }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Catégories (gestion)
      description: |
        Toutes les catégories, inactives comprises, avec le nombre de chambres (toutes et actives).
        Direction et réception ; jamais mis en cache.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories/{id}:
    patch:
      operationId: updateCatalogCategory
      summary: Modifier une catégorie (direction)
      description: |
        Textes (français ET anglais), prix, capacité, équipements, ordre d'affichage, activation.
        Le code ne change jamais (il figure dans les adresses du site). Une modification de prix ne
        touche que les futures réservations. Inscrit au journal d'audit (avant → après).
        Désactivation refusée tant que des séjours à venir sont réservés dans la catégorie :
        409 `CATEGORY_HAS_STAYS` (la fermeture à la vente reste possible).
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories/{id}/photos:
    get:
      operationId: listCategoryPhotos
      summary: Photos d'une catégorie
      description: |
        Dans l'ordre d'affichage ; la première est la photo principale. Direction, réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Les photos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: addCategoryPhoto
      summary: Ajouter une photo (direction)
      description: |
        Envoi multipart : `file` (JPEG, PNG ou WebP, 10 Mo au plus ; le format est lu dans le
        contenu), `altFr` et `altEn` (textes alternatifs obligatoires). La photo est tournée
        selon l'appareil, débarrassée de ses métadonnées (GPS…) et convertie en WebP de 400, 800
        et 1 600 px, sans agrandissement. Ajoutée en dernier ; 12 photos au plus par catégorie
        (409 `TOO_MANY_PHOTOS`) ; trop lourde : 413 `PHOTO_TOO_LARGE`.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altFr, altEn]
              properties:
                file: { type: string, format: binary }
                altFr: { type: string, minLength: 1, maxLength: 200 }
                altEn: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Toutes les photos de la catégorie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /admin/catalog/categories/{id}/photos/order:
    put:
      operationId: orderCategoryPhotos
      summary: Changer l'ordre des photos (direction)
      description: |
        Toutes les photos de la catégorie, chacune une fois ; la première devient la photo
        principale.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 12
      responses:
        '200':
          description: Les photos dans le nouvel ordre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/photos/{photoId}:
    parameters:
      - { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCategoryPhoto
      summary: Changer les textes alternatifs d'une photo (direction)
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alt]
              properties:
                alt: { $ref: '#/components/schemas/LocalizedText' }
      responses:
        '200':
          description: Les photos de la catégorie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteCategoryPhoto
      summary: Supprimer une photo et ses fichiers (direction)
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      responses:
        '200':
          description: Les photos restantes de la catégorie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /public/media/{file}:
    get:
      operationId: getMedia
      summary: Fichier d'une photo
      description: |
        `<uuid>-<400|800|1600>.webp`, rien d'autre. Un fichier ne change jamais (une nouvelle photo
        a un nouveau nom) : mis en cache un an. Sans session.
      tags: [Catalogue public]
      parameters:
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: L'image.
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Aucun fichier de ce nom.
  /admin/catalog/rooms:
    get:
      operationId: listCatalogRooms
      summary: Chambres (gestion)
      description: |
        Toutes les chambres, triées par étage puis numéro. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: floor, in: query, schema: { type: integer, minimum: -5, maximum: 50 } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoomAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogRoom
      summary: Ajouter une chambre (direction)
      description: |
        Numéro déjà utilisé : 409 `ROOM_NUMBER_TAKEN`.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRoom' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rooms/{id}:
    patch:
      operationId: updateCatalogRoom
      summary: Modifier une chambre (direction)
      description: |
        Numéro, étage, catégorie, activation. Aucune suppression : une chambre se désactive.
        Désactivation ou changement de catégorie refusés tant que la chambre est attribuée à des
        séjours à venir : 409 `ROOM_HAS_STAYS` (changez-les de chambre d'abord).
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rate-periods:
    get:
      operationId: listCatalogRatePeriods
      summary: Saisons et événements
      description: |
        Périodes en cours et à venir ; toutes avec `includePast=true`. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      parameters:
        - { name: includePast, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RatePeriod' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogRatePeriod
      summary: Ajouter une saison ou un événement (direction)
      description: |
        Nuits données par la première et la dernière, incluses. Deux périodes du même type et
        de la même portée (toutes catégories, ou la même catégorie) ne peuvent pas partager une
        nuit : 409 `RATE_PERIOD_OVERLAP`. Un événement l'emporte sur une saison.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRatePeriod' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatePeriod' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/catalog/rate-periods/{id}:
    patch:
      operationId: updateCatalogRatePeriod
      summary: Modifier une période (direction)
      description: |
        Mêmes règles que la création.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatePeriodChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatePeriod' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteCatalogRatePeriod
      summary: Supprimer une période (direction)
      description: |
        Les valeurs supprimées restent lisibles dans le journal d'audit.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Supprimé.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/sales-closures:
    get:
      operationId: listCatalogSalesClosures
      summary: Fermetures de vente
      description: |
        Fermetures en cours et à venir. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SalesClosure' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createCatalogSalesClosure
      summary: Fermer une catégorie à la vente (direction, réception)
      description: |
        Ferme une catégorie à la vente en ligne et au comptoir sur des nuits données (incluses).
        Refusé si la dernière nuit est passée.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSalesClosure' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesClosure' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/sales-closures/{id}:
    delete:
      operationId: deleteCatalogSalesClosure
      summary: Rouvrir à la vente (direction, réception)
      description: |
        Supprime la fermeture ; inscrit au journal d'audit.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Supprimé.
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/catalog/services:
    get:
      operationId: listCatalogServices
      summary: Services et options (gestion)
      description: |
        Tous les services, inactifs compris, avec le taux de TVA. Direction et réception.
      tags: [Catalogue]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Liste (direction, réception).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAdmin' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/catalog/services/{id}:
    patch:
      operationId: updateCatalogService
      summary: Modifier un service (direction)
      description: |
        Nom, prix TTC, unité de prix, TVA, réservable en ligne, activation. Le code ne change
        pas.
      tags: [Catalogue]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceChanges' }
      responses:
        '200':
          description: Modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAdmin' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms:
    get:
      operationId: getHousekeepingBoard
      summary: État du ménage
      description: |
        Chambres actives et leur état, triées par étage puis numéro, avec le décompte de
        l'hôtel. Direction, réception et ménage ; jamais mis en cache.
      tags: [Ménage]
      security: [{ staffSession: [] }]
      parameters:
        - { name: floor, in: query, schema: { type: integer, minimum: -5, maximum: 50 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HousekeepingStatus' } }
      responses:
        '200':
          description: État du ménage.
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HousekeepingRoom' }
                  summary:
                    type: object
                    required: [total, dirty]
                    properties:
                      total: { type: integer, description: Chambres actives. }
                      dirty: { type: integer, description: Chambres à nettoyer. }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms/{id}:
    patch:
      operationId: setHousekeepingStatus
      summary: Changer l'état d'une chambre
      description: |
        Ménage et direction : propre ou à nettoyer. Réception : à nettoyer seulement (sinon 403
        `HOUSEKEEPING_STATUS_FORBIDDEN`). Chambre désactivée ou inconnue : 404. Inscrit au
        journal d'audit si l'état change.
      tags: [Ménage]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/HousekeepingStatus' }
      responses:
        '200':
          description: Chambre dans son nouvel état.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HousekeepingRoom' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/housekeeping/rooms/status:
    post:
      operationId: setHousekeepingStatusOfRooms
      summary: Changer l'état de plusieurs chambres
      description: |
        Tout ou rien : si une chambre est inconnue ou désactivée (404), aucune ne change.
        `changed` compte les chambres dont l'état a vraiment changé. Mêmes droits que pour une
        chambre.
      tags: [Ménage]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomIds, status]
              properties:
                roomIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/HousekeepingStatus' }
      responses:
        '200':
          description: Chambres dans leur nouvel état.
          content:
            application/json:
              schema:
                type: object
                required: [items, changed]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HousekeepingRoom' }
                  changed: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/incidents:
    get:
      operationId: listIncidents
      summary: Pannes
      description: |
        Pannes non clôturées (toutes avec `includeClosed=true`), les urgentes d'abord puis les
        plus récentes. 200 au maximum. Tous les rôles du personnel ; jamais mis en cache.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IncidentStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/IncidentPriority' } }
        - { name: roomId, in: query, schema: { type: string, format: uuid } }
        - name: mine
          in: query
          description: '« true » : seulement les pannes assignées à la personne connectée.'
          schema: { type: string, enum: ['true', 'false'] }
        - { name: includeClosed, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Pannes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: reportIncident
      summary: Signaler une panne
      description: |
        Une chambre ou un lieu est obligatoire. « Chambre inutilisable » (`blocksRoom`, chambre
        seulement) la retire de la vente aussitôt, même si elle est réservée. Tous les rôles.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewIncident' }
      responses:
        '201':
          description: Panne enregistrée, avec son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/rooms:
    get:
      operationId: listIncidentRooms
      summary: Chambres actives (formulaire de signalement)
      description: |
        Numéro et étage des chambres actives, pour choisir la chambre d'une panne. Tous les
        rôles du personnel.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Chambres actives.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, number, floor]
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        floor: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/technicians:
    get:
      operationId: listTechnicians
      summary: Techniciens actifs (direction, réception)
      description: |
        Pour choisir à qui assigner une panne.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Techniciens actifs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonName' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}:
    get:
      operationId: getIncident
      summary: Une panne et son historique
      description: |
        Tous les rôles du personnel.
      tags: [Pannes]
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/status:
    post:
      operationId: changeIncidentStatus
      summary: Changer l'état d'une panne
      description: |
        Technique : signalée → en cours → résolue. Direction : tout, dont clôturer une panne
        résolue ou la rouvrir (résolue → en cours). Résolue : la chambre revient à la vente ;
        rouverte : elle est de nouveau bloquée. Changement inexistant : 409
        `INCIDENT_TRANSITION_INVALID` ; rôle non autorisé : 403.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/IncidentStatus' }
                comment: { type: [string, 'null'], maxLength: 4000 }
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/assignment:
    post:
      operationId: assignIncident
      summary: Assigner une panne (direction, réception)
      description: |
        À un technicien actif (sinon 400) et/ou à un prestataire externe nommé en texte. Panne
        clôturée : 409 `INCIDENT_CLOSED`.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignedTo]
              properties:
                assignedTo: { type: [string, 'null'], format: uuid }
                externalContractor: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/incidents/{id}/comments:
    post:
      operationId: commentIncident
      summary: Commenter une panne
      description: |
        Ajoute un commentaire à l'historique. Tous les rôles ; panne clôturée : 409
        `INCIDENT_CLOSED`.
      tags: [Pannes]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: La panne et son historique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/availability:
    get:
      operationId: searchAvailability
      summary: Disponibilités et prix d'un séjour (saisie au comptoir)
      description: |
        Pour chaque catégorie active : chambres restant à vendre nuit par nuit (chambres actives
        non bloquées, moins les chambres réservées ; un blocage levé ne compte pas), fermeture à
        la vente signalée, et prix de chaque chambre demandée aux deux tarifs, avec la taxe de
        séjour à part. Rien n'est retenu : la réservation revérifie. Direction et réception.
        Limites du personnel : arrivée ni passée ni à plus de 730 jours, 90 nuits au plus.
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - { name: checkIn, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOut, in: query, required: true, schema: { type: string, format: date } }
        - name: guests
          in: query
          required: true
          description: |
            Une chambre par bloc séparé par « _ » ; dans chaque bloc, les adultes puis l'âge de
            chaque enfant, séparés par « - ». « 2-6_3 » : 2 adultes et un enfant de 6 ans, puis
            3 adultes. 5 chambres, 4 adultes et 3 enfants par chambre au plus.
          schema: { type: string, maxLength: 60, example: '2-6_3' }
      responses:
        '200':
          description: Disponibilités et prix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/reservations:
    get:
      operationId: listReservations
      summary: Rechercher les réservations
      description: |
        Par défaut, les arrivées à partir d'aujourd'hui ; une recherche (`q`) ou une période
        demandée regarde toutes les dates. Réservations archivées exclues. 25 par page.
        Direction et réception.
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - name: q
          in: query
          description: Référence exacte, ou partie du nom, du prénom ou de l'e-mail du client.
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReservationStatus' }
        - name: paymentStatus
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - { name: source, in: query, schema: { type: string, enum: [website, phone, desk] } }
        - { name: arrivalFrom, in: query, schema: { type: string, format: date } }
        - { name: arrivalTo, in: query, schema: { type: string, format: date } }
        - name: unassigned
          in: query
          description: Seulement les réservations dont une chambre n'a pas encore de numéro.
          schema: { type: string, enum: ['true', 'false'] }
        - name: sort
          in: query
          description: Arrivée croissante (défaut), création ou total décroissants.
          schema: { type: string, enum: [checkIn, created, total], default: checkIn }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Une page de réservations.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReservationSummary' } }
                  total: { type: integer, description: Réservations correspondant aux filtres. }
                  page: { type: integer }
                  pageSize: { type: integer, example: 25 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createReservation
      summary: Saisir une réservation (téléphone ou comptoir)
      description: |
        Dans une seule transaction : verrou des catégories demandées, capacité (sonde P1),
        fermeture à la vente (409 `CATEGORY_CLOSED`), disponibilité de chaque nuit
        (409 `NOT_AVAILABLE`), prix des nuits figés, prestations, taxe de séjour à part,
        journal. Statut « confirmée », paiement « non payé ». Le même en-tête
        `Idempotency-Key` renvoie la même réponse (en-tête `Idempotent-Replayed: true`) ;
        réutilisé pour une autre demande : 422 `IDEMPOTENCY_KEY_REUSED`.
      tags: [Réservations]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBooking' }
      responses:
        '201':
          description: La réservation créée (ou la réponse déjà donnée pour cette clé).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}:
    get:
      operationId: getReservation
      summary: Détail d'une réservation
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Client, chambres, nuits, prestations, taxe et version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: changeReservation
      summary: Modifier les dates, les voyageurs ou les notes
      description: |
        Verrou optimiste : l'en-tête `If-Match` porte la `version` lue (428 `VERSION_REQUIRED`
        sans lui, 412 `RESERVATION_CHANGED` si un collègue a modifié la réservation entre-temps,
        avec son nom et l'heure). Dates et voyageurs : réservation confirmée seulement ; tout le
        séjour est recalculé aux tarifs du jour (prestations et taxe recomptées) ; nuits ajoutées
        fermées à la vente : 409 `CATEGORY_CLOSED` ; plus de place : 409 `NOT_AVAILABLE` ;
        chambre attribuée prise ou hors service sur les nouvelles nuits : 409 `ROOM_NOT_FREE`.
        Tarif non remboursable : direction seule (403 `MANAGEMENT_ONLY`), motif obligatoire.
        `?preview=true` renvoie le nouveau prix sans rien enregistrer.
      tags: [Réservations]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' } }
        - { name: preview, in: query, schema: { type: string, enum: ['true', 'false'] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationChanges' }
      responses:
        '200':
          description: La réservation modifiée, ou l'aperçu du nouveau prix (`?preview=true`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ReservationDetail' }
                  - { $ref: '#/components/schemas/ChangePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/cancellation:
    get:
      operationId: getCancellationFee
      summary: Frais d'une annulation faite maintenant
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Frais, échéance de l'annulation gratuite, réservé à la direction ou non.
          content:
            application/json:
              schema:
                type: object
                required: [feeCents, freeCancellationUntil, managementOnly]
                properties:
                  feeCents: { type: integer }
                  freeCancellationUntil: { type: [string, 'null'], format: date-time }
                  managementOnly: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/cancel:
    post:
      operationId: cancelReservation
      summary: Annuler une réservation
      description: |
        Avant l'arrivée seulement (409 `RESERVATION_STATE`). Tarif flexible : gratuit jusqu'à
        l'échéance, puis la première nuit de chaque chambre (RM-15) ; non remboursable : toutes
        les nuits restent dues et seule la direction annule (RM-16, RM-18). Les frais sont
        enregistrés à encaisser ; `waiveFee: true` (direction seule) y renonce. Les chambres
        sont libérées aussitôt.
      tags: [Réservations]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                waiveFee: { type: boolean, default: false }
      responses:
        '200':
          description: La réservation annulée, avec `cancellationFeeCents`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/rooms/{lineId}/free-rooms:
    get:
      operationId: listFreeRooms
      summary: Chambres proposées par le sélecteur
      description: |
        Chambres actives de la catégorie réservée, libres et en service sur toutes les nuits du
        séjour (sondes P3 et P4), avec leur propreté.
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Chambres libres.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, number, floor, housekeepingStatus]
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: string }
                        floor: { type: integer }
                        housekeepingStatus: { type: string, enum: [clean, dirty] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/rooms/{lineId}/room:
    put:
      operationId: assignRoom
      summary: Attribuer, changer ou retirer la chambre
      description: |
        `roomId: null` retire la chambre. Refusé : autre catégorie (400), chambre désactivée
        (409 `ROOM_INACTIVE`, sonde P3), hors service sur une nuit (409 `ROOM_OUT_OF_SERVICE`,
        sonde P4), déjà attribuée (409 `ROOM_ALREADY_ASSIGNED`, garanti aussi par la base).
      tags: [Réservations]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomId]
              properties:
                roomId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: La réservation avec sa chambre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/customers:
    get:
      operationId: searchCustomers
      summary: Rechercher un client (formulaire de réservation)
      description: |
        Nom, prénom ou e-mail contenant `q` ; 10 résultats au plus ; clients anonymisés exclus.
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: Clients trouvés.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/planning:
    get:
      operationId: getPlanning
      summary: Planning des chambres (chambres × jours)
      description: |
        Pour chaque catégorie : ses chambres (actives, ou désactivées avec un séjour sur la
        période) avec leurs séjours et leurs blocages en cours, et la ligne « À attribuer » des
        séjours sans numéro de chambre. Réservations annulées exclues. Tous les rôles, en
        lecture ; le nom du client est retiré pour le ménage et la technique.
      tags: [Réservations]
      security: [{ staffSession: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - name: to
          in: query
          required: true
          description: Dernier jour affiché, inclus ; 31 jours au plus depuis `from`.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Le planning de la période.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Planning' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/front-desk:
    get:
      operationId: getFrontDesk
      summary: Arrivées et départs du jour
      description: |
        Arrivées du jour (à faire d'abord, puis faites ou non présentées) et réservations
        confirmées dont l'arrivée est passée sans arrivée (`late`) ; départs du jour et clients
        encore là après leur jour de départ. Les compteurs ne portent que sur le jour. Direction
        et réception.
      tags: [Réception]
      security: [{ staffSession: [] }]
      parameters:
        - name: date
          in: query
          required: false
          description: Le jour affiché ; aujourd'hui par défaut.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Les arrivées et les départs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrontDeskDay' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/check-in:
    post:
      operationId: checkInReservation
      summary: Enregistrer l'arrivée
      description: |
        Réservation confirmée, du jour d'arrivée à la veille du départ (409
        `RESERVATION_STATE`). Chaque chambre doit être attribuée (409 `ROOM_NOT_ASSIGNED`) et en
        service jusqu'au départ (409 `ROOM_OUT_OF_SERVICE`) ; une chambre à nettoyer est refusée
        (409 `ROOM_DIRTY`) sauf avec `acceptDirtyRoom: true`, inscrit au journal avec les
        vérifications cochées. Verrou optimiste : `If-Match` (428, 412).
      tags: [Réception]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                identityChecked: { type: boolean, default: false }
                policeFormDone: { type: boolean, default: false }
                acceptDirtyRoom: { type: boolean, default: false }
      responses:
        '200':
          description: La réservation, statut `checked_in`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/check-out:
    post:
      operationId: checkOutReservation
      summary: Enregistrer le départ
      description: |
        Client arrivé, le jour du départ ou plus tard (départ oublié) ; un départ anticipé est
        refusé pour l'instant (409 `RESERVATION_STATE`). Les chambres passent « à nettoyer ».
        Le solde et la facture viendront avec la facturation. Verrou optimiste : `If-Match`.
      tags: [Réception]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' } }
      responses:
        '200':
          description: La réservation, statut `checked_out`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /admin/reservations/{id}/no-show:
    post:
      operationId: declareNoShow
      summary: Déclarer une non-présentation
      description: |
        Réservation confirmée, à partir du lendemain de l'arrivée prévue (409
        `RESERVATION_STATE`). Frais (RM-17) : première nuit de chaque chambre au tarif flexible,
        toutes les nuits au tarif non remboursable, enregistrés à encaisser
        (`cancellationFeeCents`) ; les chambres sont libérées. Verrou optimiste : `If-Match`.
      tags: [Réception]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' } }
      responses:
        '200':
          description: La réservation, statut `no_show`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /admin/dashboard:
    get:
      operationId: getDashboard
      summary: Tableau de bord de la direction
      description: |
        Occupation de la nuit de `date` et de son mois (chambres vendues / chambres actives hors
        service exclu, nuit par nuit), chiffre d'affaires hébergement du mois (nuits vendues et
        frais d'annulation ou de non-présentation des séjours prévus ce mois-là), prix moyen par
        nuit vendue, le mois précédent pour comparer, arrivées et départs du jour (mêmes
        compteurs que l'écran « Aujourd'hui »), pannes encore ouvertes. Direction seule.
      tags: [Tableau de bord]
      security: [{ staffSession: [] }]
      parameters:
        - name: date
          in: query
          required: false
          description: Le jour regardé ; aujourd'hui par défaut.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Les chiffres.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: riad.sid
      description: Session du personnel ; déconnexion après 30 min d'inactivité ou 12 h.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Jeton reçu à la connexion, exigé sur toute requête qui modifie des données.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Erreur au format RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    LocalizedText:
      type: object
      required: [fr, en]
      properties:
        fr: { type: string }
        en: { type: string }
    IncidentStatus:
      type: string
      enum: [reported, in_progress, resolved, closed]
      description: Signalée, en cours, résolue, clôturée.
    IncidentPriority:
      type: string
      enum: [urgent, normal, low]
    PersonName:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
    Incident:
      type: object
      required:
        - id
        - reference
        - room
        - location
        - title
        - description
        - priority
        - status
        - blocksRoom
        - roomBlocked
        - reportedAt
        - reportedBy
        - assignedTo
        - externalContractor
        - resolvedAt
        - closedAt
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: INC-000042 }
        room:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, number]
              properties:
                id: { type: string, format: uuid }
                number: { type: string }
        location: { type: [string, 'null'] }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        blocksRoom: { type: boolean, description: Chambre déclarée inutilisable. }
        roomBlocked: { type: boolean, description: Chambre hors vente à cause de cette panne. }
        reportedAt: { type: string, format: date-time }
        reportedBy: { $ref: '#/components/schemas/PersonName' }
        assignedTo:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PersonName'
        externalContractor: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          required: [events, affectedStays]
          properties:
            affectedStays:
              description: |
                Séjours à venir ou en cours attribués à la chambre pendant qu'elle est hors
                service à cause de cette panne : à changer de chambre.
              type: array
              items:
                type: object
                required: [reservationId, reference, checkIn, checkOut]
                properties:
                  reservationId: { type: string, format: uuid }
                  reference: { type: string }
                  checkIn: { type: string, format: date }
                  checkOut: { type: string, format: date }
            events:
              type: array
              items:
                type: object
                required: [id, type, fromStatus, toStatus, comment, actor, createdAt]
                properties:
                  id: { type: string }
                  type: { type: string, enum: [status_change, assignment, comment] }
                  fromStatus:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/IncidentStatus'
                  toStatus:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/IncidentStatus'
                  comment: { type: [string, 'null'] }
                  actor:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/PersonName'
                  createdAt: { type: string, format: date-time }
    NewIncident:
      type: object
      additionalProperties: false
      required: [title, description, priority]
      properties:
        roomId: { type: [string, 'null'], format: uuid }
        location: { type: [string, 'null'], maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        blocksRoom: { type: boolean, default: false }
    HousekeepingStatus:
      type: string
      enum: [clean, dirty]
      description: '« clean » : propre ; « dirty » : à nettoyer.'
    HousekeepingRoom:
      type: object
      required: [id, number, floor, categoryCode, categoryName, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: '214' }
        floor: { type: integer }
        categoryCode: { type: string }
        categoryName: { type: string }
        status: { $ref: '#/components/schemas/HousekeepingStatus' }
    Amenity:
      type: string
      enum:
        - wifi
        - air-conditioning
        - tv
        - safe
        - hair-dryer
        - shower
        - bathtub
        - sitting-area
        - port-view
    Night:
      type: string
      format: date
      description: Nuit désignée par le jour où elle commence (AAAA-MM-JJ).
    Occupancy:
      type: object
      required: [adults, childrenAges]
      properties:
        adults: { type: integer, minimum: 1, maximum: 4 }
        childrenAges:
          type: array
          maxItems: 3
          items: { type: integer, minimum: 0, maximum: 17 }
    RoomOffer:
      type: object
      required: [fits]
      description: |
        Prix du séjour dans une chambre demandée ; `fits: false` seul si les voyageurs ne
        tiennent pas dans la catégorie (bébé de moins de 2 ans non compté).
      properties:
        fits: { type: boolean }
        flexibleCents: { type: integer }
        nonRefundableCents: { type: integer }
        touristTaxCents:
          type: integer
          description: Par adulte et par nuit ; mineurs exonérés.
        nights:
          type: array
          items:
            type: object
            required: [night, adjustmentPct, flexibleCents, nonRefundableCents]
            properties:
              night: { $ref: '#/components/schemas/Night' }
              adjustmentPct: { type: number, description: Saison ou événement appliqué (0 sinon). }
              flexibleCents: { type: integer }
              nonRefundableCents: { type: integer }
    Availability:
      type: object
      required: [checkIn, checkOut, nights, rooms, categories]
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        nights: { type: integer }
        rooms: { type: array, items: { $ref: '#/components/schemas/Occupancy' } }
        categories:
          type: array
          items:
            type: object
            required:
              - id
              - code
              - name
              - maxOccupancy
              - baseOccupancy
              - freeRooms
              - freeRoomsByNight
              - closed
              - offers
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              maxOccupancy: { type: integer }
              baseOccupancy: { type: integer }
              freeRooms:
                type: integer
                description: Chambres libres sur chaque nuit du séjour (la nuit la plus pleine).
              freeRoomsByNight:
                type: array
                items:
                  type: object
                  required: [night, free]
                  properties:
                    night: { $ref: '#/components/schemas/Night' }
                    free:
                      type: integer
                      description: Négatif si plus de séjours que de chambres.
              closed: { type: boolean, description: Fermée à la vente sur au moins une nuit. }
              offers:
                type: array
                description: Une offre par chambre demandée, dans l'ordre de la demande.
                items: { $ref: '#/components/schemas/RoomOffer' }
    ReservationStatus:
      type: string
      enum: [pending_payment, confirmed, checked_in, checked_out, cancelled, no_show, expired]
    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, partially_refunded, refunded]
    Customer:
      type: object
      required: [id, firstName, lastName, email, phone, preferredLanguage]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        preferredLanguage: { type: string, enum: [fr, en] }
    NewBooking:
      type: object
      additionalProperties: false
      required: [checkIn, checkOut, ratePlan, source, rooms]
      description: Un client existant (`customerId`) ou un nouveau (`newCustomer`), jamais les deux.
      properties:
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        ratePlan: { type: string, enum: [flexible, non_refundable] }
        source: { type: string, enum: [phone, desk] }
        rooms:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [categoryId, adults]
            properties:
              categoryId: { type: string, format: uuid }
              adults: { type: integer, minimum: 1, maximum: 4 }
              childrenAges:
                type: array
                maxItems: 3
                items: { type: integer, minimum: 0, maximum: 17 }
              babyCot: { type: boolean, default: false }
        services:
          type: array
          maxItems: 10
          description: Prestations sur tout le séjour ; `quantity` ne sert qu'à l'unité.
          items:
            type: object
            additionalProperties: false
            required: [serviceId]
            properties:
              serviceId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99, default: 1 }
        customerId: { type: string, format: uuid }
        newCustomer:
          type: object
          additionalProperties: false
          required: [firstName, lastName, email]
          properties:
            firstName: { type: string, minLength: 1, maxLength: 100 }
            lastName: { type: string, minLength: 1, maxLength: 100 }
            email: { type: string, format: email, maxLength: 254 }
            phone: { type: string, maxLength: 30 }
            preferredLanguage: { type: string, enum: [fr, en], default: fr }
        customerMessage: { type: string, maxLength: 500 }
        internalNotes: { type: string, maxLength: 2000 }
    PlanningStay:
      type: object
      required: [reservationId, lineId, reference, checkIn, checkOut, status, adults, children]
      properties:
        reservationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        reference: { type: string }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        status: { $ref: '#/components/schemas/ReservationStatus' }
