                    rateLabel: { type: [string, 'null'], example: '+30 %' }
        charges:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind:
                type: string
                enum: [service, tourist_tax, cancellation_fee, no_show_fee, other]
              label: { type: string }
              quantity: { type: number }
              unitPriceCents: { type: integer }
              vatRate: { type: number }
              totalCents: { type: integer }
    CategoryAdmin:
