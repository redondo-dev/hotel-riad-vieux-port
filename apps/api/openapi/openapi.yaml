              adults: { type: integer }
              childrenAges: { type: array, items: { type: integer } }
              babyCot: { type: boolean }
              subtotalCents: { type: integer }
              nights:
                type: array
                items:
                  type: object
                  properties:
                    night: { $ref: '#/components/schemas/Night' }
