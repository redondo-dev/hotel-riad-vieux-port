      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Photo' } }
    PublicService:
      type: object
      required: [code, name, unitPriceCents, pricingUnit]
      properties:
        code: { type: string, example: breakfast }
        name: { $ref: '#/components/schemas/LocalizedText' }
        unitPriceCents: { type: integer, example: 1400 }
        pricingUnit:
          type: string
          enum: [per_person_night, per_night, per_stay, per_unit]
